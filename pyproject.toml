[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "supercode"
version = "0.2.0"
license = "Apache-2.0"
authors = [
  {name = "Elisa Chiarotto"},
]
description = "SuperCode model package"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.0",
    "huggingface-hub>=1.28.0",
    "human-eval>=1.0.3",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "lm-eval>=0.4.12",
    "matplotlib>=3.10.9",
    "optimum>=2.3.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
    "sinq>=0.2.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[tool.setuptools.packages.find]
where = ["supercode"]

#[tool.uv.workspace]
#members = [
#    "supercode",
#]

[project.scripts]
run-supercode = "supercode.__main__:main"
